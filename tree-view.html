<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>游戏共鸣者议会 · 共鸣之树</title>
    <meta name="description" content="四个协会共同汇聚而成的共鸣之树。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260604-2">
  </head>
  <body data-page="tree-view">
    <div class="ambient" aria-hidden="true">
      <span class="moon"></span>
      <span class="ruin-arch"></span>
      <span class="rune-ring"></span>
      <span class="mist mist-a"></span>
      <span class="mist mist-b"></span>
    </div>

    <main class="shell">
      <section class="tree-view-archive result-archive" id="tree-view-archive" aria-labelledby="tree-view-title">
        <header class="result-archive-header">
          <h1 class="tree-view-page-title" id="tree-view-title">
            <span>游戏共鸣者议会</span>
            <strong>共鸣之树</strong>
          </h1>
          <p class="result-status" id="tree-view-status">四个协会分支以浏览、点赞、评论与发帖汇聚积分。树干随总共鸣值成长</p>
        </header>

        <div class="tree-view-stage">
          <section class="tree-view-board" aria-label="协会共鸣树">
            <div class="tree-view-board-head">
              <div class="tree-view-total">
                <span>总共鸣值</span>
                <strong id="tree-total-score">0</strong>
              </div>
            </div>

            <div class="tree-visual tree-view-visual">
              <div class="tree-trunk-layers" id="tree-trunk-layers" aria-hidden="true"></div>
              <svg
                class="tree-svg"
                id="tree-svg"
                viewBox="0 0 920 660"
                role="img"
                aria-labelledby="tree-svg-title tree-svg-desc"
              >
                <title id="tree-svg-title">协会共鸣树</title>
                <desc id="tree-svg-desc">每个枝桠代表一个协会，共鸣由协会积分汇聚而成。</desc>
              </svg>
            </div>
          </section>
        </div>

        <div class="tree-view-details">
          <div class="tree-view-formula" aria-label="共鸣计量法则">
            <div class="tree-view-formula-title">
              <span aria-hidden="true">✦</span>
              <strong>共鸣计量法则</strong>
              <span aria-hidden="true">✦</span>
            </div>
            <div class="tree-view-formula-values">
              <span><small>浏览</small><b>×1</b></span>
              <span><small>点赞</small><b>×3</b></span>
              <span><small>评论</small><b>×5</b></span>
              <span><small>发帖</small><b>×10</b></span>
            </div>
          </div>

          <section class="result-spectrum" aria-labelledby="tree-resonance-title">
            <h2 class="result-spectrum-title" id="tree-resonance-title">协会共鸣值</h2>
            <div class="spectrum-list" id="tree-resonance-bars"></div>
          </section>

        </div>

        <a class="result-tree-link" href="index.html?card=1">返回共鸣身份卡</a>
      </section>
    </main>

    <script type="module" src="src/treeView.js?v=20260604-2"></script>
  </body>
</html>
